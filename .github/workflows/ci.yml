name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Tests (byte-exact packet checks)
        run: swift test
      - name: Build app bundle
        run: ./scripts/make-app.sh
